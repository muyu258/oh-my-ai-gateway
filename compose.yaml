services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: gateway
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gateway"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  app:
    build:
      context: .
      target: application
    environment:
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-1}
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gateway
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-TOKEN}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
